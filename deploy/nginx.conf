# ============================================================
#  nginx — serves the React build and proxies the API.
#
#  SINGLE ORIGIN, on purpose. The frontend is served from
#  https://__DOMAIN__ and the API from https://__DOMAIN__/api, so
#  frontend/src/config.jsx falls through to its same-origin '/api'
#  default and VITE_API_URL never needs to be set at build time.
#  That removes a whole class of outage: a missing build-time env
#  var once baked localhost into the bundle and broke every login
#  on mobile. A relative path cannot have that bug.
#
#  It also means the browser makes no cross-origin request at all,
#  so CORS stops being load-bearing. CLIENT_ORIGINS must still be
#  set — server.js refuses to start in production without it — but
#  it is now a second line of defence rather than the only one.
#
#  Placeholders __DOMAIN__ and __APP_USER__ are filled by
#  setup-server.sh. certbot rewrites this file to add the TLS
#  listener and the :80 redirect; that edit is expected.
#
#  SECURITY HEADERS live in nginx-security-headers.conf and are
#  `include`d per-location below rather than declared once here. That is
#  not a style choice: nginx discards every inherited add_header in any
#  location that declares one of its own, and two locations here declare
#  a Cache-Control. Read the header of that file before moving these
#  includes anywhere.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # NOT dist/. vite.config.js sets `outDir: 'build'` deliberately, to keep
    # the CRA path so existing deploy configs did not need touching. Pointing
    # this at Vite's default dist/ yields 404 for every single request while
    # nginx itself reports perfectly healthy.
    root /home/__APP_USER__/app/frontend/build;
    index index.html;

    # Uploaded/generated PDFs and images can be large; API JSON is not.
    client_max_body_size 12m;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- API ------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # server.js sets `app.set('trust proxy', 1)`, which makes
        # express-rate-limit read the LAST entry of X-Forwarded-For.
        # Without these headers every request would look like it came
        # from 127.0.0.1 and all five rate limiters would share one
        # bucket — the login limiter would lock out the whole world
        # after 8 bad passwords from anybody.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;

        # The session token is slid forward on a response header
        # (X-Session-Token / X-Session-Expires-In, see
        # backend/utils/sessionToken.js). nginx passes response
        # headers through untouched, but underscores_in_headers is
        # off by default and these use hyphens — no change needed.
        proxy_read_timeout 75s;

        # Verification slips and receipts stream as PDFs/PNGs.
        proxy_buffering off;
    }

    # ---- SPA ------------------------------------------------
    # Hashed asset filenames from Vite are immutable; cache them hard.
    location /assets/ {
        include snippets/datahood-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached, or a returning user keeps
    # loading an old bundle that points at deleted asset hashes and
    # sees a blank page after every deploy.
    location = /index.html {
        include snippets/datahood-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are React routes, not 404s.
    #
    # Reached by every SPA route, and also the fall-through for
    # /manifest.json, /service-worker.js, the icons and robots.txt. The
    # try_files below internally redirects unknown paths to /index.html,
    # which re-enters the exact-match location above — so an SPA route gets
    # that block's headers, not this one's. Both include the snippet, so it
    # does not matter which path a request took.
    location / {
        include snippets/datahood-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
